[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
# L'URL réelle est injectée par env.py depuis la configuration applicative.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
