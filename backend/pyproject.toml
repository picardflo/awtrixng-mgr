[project]
name = "awtrixng-mgr"
version = "0.4.1"
description = "Middleware between your services and AWTRIX NG displays"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "cryptography>=43.0",
    # Still icons come from LaMetric as PNG, which the firmware cannot read.
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "device: tests that talk to a real AWTRIX NG device (deselected by default)",
]
# The device tests write to a real display. They run only when asked for by
# name: `pytest -m device`.
addopts = "-m 'not device'"

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic revisions are generated code: not reformatted by hand.
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
