server {
    listen 80;
    # IPv6 aussi : un réseau Docker peut en avoir, et nginx n'écoutant qu'en
    # IPv4 donnait un « connection refused » que rien n'expliquait côté client.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (§19). The CSP is deliberately strict: the application
    # loads no external script and no external font.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    # img-src also allows developer.lametric.com: the icon picker and the
    # matrix preview show the real animated GIF, served by LaMetric. Nothing
    # is redistributed from here.
    # Sur une seule ligne, obligatoirement. nginx ne connaît pas la continuation
    # par antislash dans une chaîne : il conservait l'antislash ET le saut de
    # ligne dans la valeur, produisant un en-tête HTTP invalide. Les navigateurs
    # le toléraient ; un client strict refusait toute la réponse
    # (HPE_CR_EXPECTED, « missing expected CR after header value »), ce qui
    # rendait l'API inutilisable depuis un tableau de bord.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://developer.lametric.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The frontend fronts the API: a single origin for the browser, therefore
    # no CORS (ADR-003).
    location /api/ {
        proxy_pass http://awtrixng-mgr-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A device test waits for the AWTRIX to answer.
        proxy_read_timeout 30s;
    }

    # Le cache se règle par `expires`, jamais par `add_header Cache-Control`.
    # nginx n'hérite des add_header du bloc serveur que si le `location` n'en
    # déclare aucun : un seul y suffisait pour que /assets/ perde le CSP et le
    # nosniff. `expires` pose l'en-tête sans casser l'héritage.
    #
    # Les noms des fichiers d'assets portent une empreinte : ils ne changent
    # jamais de contenu, et peuvent donc être gardés un an.
    location /assets/ {
        expires 1y;
    }

    # index.html, lui, garde son nom à chaque version alors qu'il pointe vers
    # un bundle au nom neuf. Gardé par le navigateur, une mise à jour atterrit
    # sur l'ancien JavaScript : l'interface reste en place, et les chaînes
    # ajoutées dans la version manquent — une page française où un libellé
    # neuf s'affiche en anglais. `expires -1` envoie `Cache-Control: no-cache`,
    # soit « revalide avant de servir ».
    location = /index.html {
        expires -1;
    }

    # SPA: any unknown route renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
